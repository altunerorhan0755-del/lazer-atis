<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lazer Atış</title></head>
<body style="margin:0;background:#111;color:#eee;font:15px system-ui">
<div id="boot" style="padding:12px">Yükleniyor…</div>
<script>
const U="https://piwyqbqknzykwoujmoey.supabase.co",
K="sb_publishable_y9NvJXOGbl2J_Ln-8WLLVw_MK84wAaR";
(async()=>{
let c=localStorage.getItem("code");
try{const r=await fetch(U+"/rest/v1/app_code?name=eq.main&select=code,version",
{headers:{apikey:K,Authorization:"Bearer "+K,Accept:"application/vnd.pgrst.object+json"},cache:"no-store"});
if(r.ok){const j=await r.json();c=j.code;localStorage.setItem("code",c);localStorage.setItem("ver",j.version);}}catch(e){}
if(!c){document.getElementById("boot").textContent="Uygulama yüklenemedi. İnternet bağlantını kontrol et.";return;}
document.getElementById("boot").remove();
new Function(c)();
})();
</script></body></html>
