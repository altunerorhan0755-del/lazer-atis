name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/lazer/atis app/src/main/res/mipmap-xxxhdpi
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'LazerAtis'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.lazer.atis'
            compileSdk 34
            defaultConfig { applicationId 'com.lazer.atis'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.CAMERA"/>
            <uses-feature android:name="android.hardware.camera" android:required="false"/>
            <application android:label="Lazer Atis" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/lazer/atis/MainActivity.java <<'EOF'
          package com.lazer.atis;
          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.*;
          import android.widget.EditText;
          public class MainActivity extends Activity {
            WebView w; PermissionRequest pend; ValueCallback<Uri[]> fc;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              w = new WebView(this); setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setMediaPlaybackRequiresUserGesture(false);
              w.setWebViewClient(new WebViewClient());
              w.setWebChromeClient(new WebChromeClient() {
                @Override public void onPermissionRequest(final PermissionRequest r) {
                  runOnUiThread(() -> {
                    if (checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) r.grant(r.getResources());
                    else { pend = r; requestPermissions(new String[]{Manifest.permission.CAMERA}, 1); }
                  });
                }
                @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  if (fc != null) fc.onReceiveValue(null);
                  fc = cb;
                  try { startActivityForResult(p.createIntent(), 2); } catch (Exception e) { fc = null; return false; }
                  return true;
                }
                @Override public boolean onJsPrompt(WebView v, String url, String msg, String def, final JsPromptResult r) {
                  final EditText et = new EditText(MainActivity.this); et.setText(def);
                  new AlertDialog.Builder(MainActivity.this).setMessage(msg).setView(et)
                    .setPositiveButton("Tamam", (d, i) -> r.confirm(et.getText().toString()))
                    .setNegativeButton("Iptal", (d, i) -> r.cancel())
                    .setOnCancelListener(d -> r.cancel()).show();
                  return true;
                }
                @Override public boolean onJsConfirm(WebView v, String url, String msg, final JsResult r) {
                  new AlertDialog.Builder(MainActivity.this).setMessage(msg)
                    .setPositiveButton("Tamam", (d, i) -> r.confirm())
                    .setNegativeButton("Iptal", (d, i) -> r.cancel())
                    .setOnCancelListener(d -> r.cancel()).show();
                  return true;
                }
                @Override public boolean onJsAlert(WebView v, String url, String msg, final JsResult r) {
                  new AlertDialog.Builder(MainActivity.this).setMessage(msg)
                    .setPositiveButton("Tamam", (d, i) -> r.confirm())
                    .setOnCancelListener(d -> r.cancel()).show();
                  return true;
                }
              });
              w.loadUrl("https://lazer-atis.onrender.com/");
            }
            @Override public void onRequestPermissionsResult(int c, String[] p, int[] g) {
              if (pend != null) { if (g.length > 0 && g[0] == PackageManager.PERMISSION_GRANTED) pend.grant(pend.getResources()); else pend.deny(); pend = null; }
            }
            @Override protected void onActivityResult(int rq, int rs, Intent d) {
              if (rq == 2 && fc != null) { fc.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(rs, d)); fc = null; }
            }
            @Override public void onBackPressed() { if (w.canGoBack()) w.goBack(); else super.onBackPressed(); }
          }
          EOF
          curl -sSfL https://lazer-atis.onrender.com/icon-512.png -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LazerAtis.apk
          gh release delete apk-latest -y --cleanup-tag --repo ${{ github.repository }} || true
          gh release create apk-latest LazerAtis.apk --repo ${{ github.repository }} --title 'Lazer Atis APK' --notes 'Telefona indirip kurun.'
