<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lazer Atış Analizi</title>
<style>
body{margin:0;font:15px system-ui,sans-serif;background:#111;color:#eee;padding:10px}
button,select{font:inherit;padding:10px 14px;border-radius:8px;border:0;background:#2d6cdf;color:#fff;margin:3px 3px 3px 0}
button.g{background:#444}
#w{position:relative;width:100%}video{width:100%;display:block;border-radius:8px;background:#000}
#o{position:absolute;inset:0;width:100%;height:100%}
#t{width:100%;max-width:340px;background:#1b1b1b;border-radius:8px;display:block;margin:8px 0}
#msg{padding:8px 0;color:#9cf}#diag{background:#222;border-radius:8px;padding:10px;white-space:pre-line}
#zm{display:none;padding:6px 0}#zr{width:100%}
</style></head><body>
<div id="w"><video id="v" playsinline muted autoplay></video><canvas id="o"></canvas></div>
<div id="zm">Yakınlaştır / uzaklaştır<input type="range" id="zr"></div>
<div id="msg">Kamerayı başlat, sonra hedefin 4 köşesine sırayla dokun (sol-üst, sağ-üst, sağ-alt, sol-alt).</div>
<button id="b1">Kamerayı başlat</button><button id="b2" class="g">Köşeleri yeniden seç</button>
<select id="col"><option value="r">Kırmızı lazer</option><option value="g">Yeşil lazer</option></select>
<select id="hand"><option value="R">Sağ elli</option><option value="L">Sol elli</option></select>
<canvas id="t" width="340" height="340"></canvas>
<button id="b3">Analiz et</button><button id="b4" class="g">Sıfırla</button><button id="b5" class="g">Oturumu kaydet</button>
<div id="diag">Henüz atış yok.</div>
<script>
const SB_URL="https://piwyqbqknzykwoujmoey.supabase.co",
SB_KEY="sb_publishable_y9NvJXOGbl2J_Ln-8WLLVw_MK84wAaR";
const $=i=>document.getElementById(i),v=$("v"),o=$("o"),oc=o.getContext("2d"),tc=$("t").getContext("2d");
const pc=document.createElement("canvas"),px=pc.getContext("2d",{willReadFrequently:true});
let pts=[],H=null,shots=[],imgs=[],run=[],miss=0,last=0,last_an=null,track=null;
const out=s=>s[0]<0||s[0]>1||s[1]<0||s[1]>1;
function homog(s,d){const A=[];for(let i=0;i<4;i++){const[x,y]=s[i],[u,w]=d[i];
A.push([x,y,1,0,0,0,-u*x,-u*y,u]);A.push([0,0,0,x,y,1,-w*x,-w*y,w]);}
for(let i=0;i<8;i++){let m=i;for(let r=i+1;r<8;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;
[A[i],A[m]]=[A[m],A[i]];for(let r=0;r<8;r++){if(r==i)continue;const f=A[r][i]/A[i][i];
for(let c=i;c<9;c++)A[r][c]-=f*A[i][c];}}
const h=A.map((r,i)=>r[8]/r[i]);return[...h,1];}
function ap(h,x,y){const z=h[6]*x+h[7]*y+1;return[(h[0]*x+h[1]*y+h[2])/z,(h[3]*x+h[4]*y+h[5])/z];}
function resetCal(){pts=[];H=null;shots=[];imgs=[];last_an=null;draw();}
$("b1").onclick=async()=>{try{
const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:1280,height:720,frameRate:{ideal:60}}});
v.srcObject=st;track=st.getVideoTracks()[0];
await v.play();pc.width=320;pc.height=Math.round(320*v.videoHeight/v.videoWidth);o.width=v.clientWidth;o.height=v.clientHeight;
const cap=track.getCapabilities?track.getCapabilities():{};
if(cap.zoom){const z=$("zr");z.min=cap.zoom.min;z.max=cap.zoom.max;z.step=cap.zoom.step||0.1;z.value=(track.getSettings().zoom)||cap.zoom.min;$("zm").style.display="block";}
else $("msg").textContent="Bu cihaz/tarayıcı kamera yakınlaştırmayı desteklemiyor.";
requestAnimationFrame(loop);}catch(e){$("msg").textContent="Kamera açılamadı: "+e.message;}};
$("zr").oninput=()=>{if(track)track.applyConstraints({advanced:[{zoom:+$("zr").value}]}).catch(()=>{});};
$("zr").onchange=()=>{resetCal();$("msg").textContent="Yakınlaştırma değişti. Hedefin 4 köşesine yeniden dokun.";};
$("b2").onclick=()=>{resetCal();$("msg").textContent="4 köşeye dokun: sol-üst, sağ-üst, sağ-alt, sol-alt.";};
o.onclick=e=>{if(H)return;const r=o.getBoundingClientRect();pts.push([(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]);
if(pts.length==4){H=homog(pts,[[0,0],[1,0],[1,1],[0,1]]);$("msg").textContent="Hazır. Atış yap; hedef dışına çıkan atışlar turuncu görünür.";}};
function isLaser(r,g,b){return $("col").value=="r"?(r>210&&r-g>90&&r-b>90):(g>210&&g-r>90&&g-b>90);}
function loop(){requestAnimationFrame(loop);if(v.readyState<2)return;
px.drawImage(v,0,0,pc.width,pc.height);const d=px.getImageData(0,0,pc.width,pc.height).data;
let n=0,sx=0,sy=0;for(let i=0,p=0;i<d.length;i+=4,p++){if(isLaser(d[i],d[i+1],d[i+2])){n++;sx+=p%pc.width;sy+=(p/pc.width)|0;}}
const on=n>0&&n<80;
if(on){run.push([sx/n/pc.width,sy/n/pc.height]);miss=0;}
else if(run.length){miss++;if(miss>=3){if(run.length>=2&&H&&Date.now()-last>350){
const m=run.reduce((a,p)=>[a[0]+p[0]/run.length,a[1]+p[1]/run.length],[0,0]);
const[u,w]=ap(H,m[0],m[1]);
if(u>-1&&u<2&&w>-1&&w<2){shots.push([u,w]);imgs.push(m);last=Date.now();draw();}}
run=[];miss=0;}}
oc.clearRect(0,0,o.width,o.height);oc.strokeStyle="#0f0";oc.fillStyle="#0f0";oc.lineWidth=2;
pts.forEach(p=>{oc.beginPath();oc.arc(p[0]*o.width,p[1]*o.height,6,0,7);oc.fill();});
if(pts.length==4){oc.beginPath();pts.forEach((p,i)=>oc[i?"lineTo":"moveTo"](p[0]*o.width,p[1]*o.height));oc.closePath();oc.stroke();}
imgs.forEach((p,i)=>{const x=p[0]*o.width,y=p[1]*o.height,c=out(shots[i])?"#fa0":"#f33";oc.strokeStyle=c;oc.lineWidth=3;oc.beginPath();oc.arc(x,y,9,0,7);oc.stroke();
oc.font="bold 18px sans-serif";oc.lineWidth=4;oc.strokeStyle="#000";oc.strokeText(i+1,x+12,y-8);oc.fillStyle="#fff";oc.fillText(i+1,x+12,y-8);});
oc.lineWidth=2;
if(on){oc.strokeStyle="#f0f";oc.strokeRect(sx/n/pc.width*o.width-10,sy/n/pc.height*o.height-10,20,20);}}
function draw(a){const S=340,k=S/1.5,X=u=>(u+.25)*k;tc.clearRect(0,0,S,S);tc.strokeStyle="#555";tc.lineWidth=1;
for(let i=1;i<=5;i++){tc.beginPath();tc.arc(X(.5),X(.5),i*.1*k,0,7);tc.stroke();}
tc.strokeStyle="#0a0";tc.strokeRect(X(0),X(0),k,k);tc.strokeStyle="#555";
tc.beginPath();tc.moveTo(X(.5),0);tc.lineTo(X(.5),S);tc.moveTo(0,X(.5));tc.lineTo(S,X(.5));tc.stroke();
shots.forEach((s,i)=>{tc.fillStyle=out(s)?"#fa0":"#f55";tc.beginPath();tc.arc(X(s[0]),X(s[1]),6,0,7);tc.fill();tc.fillStyle="#fff";tc.font="11px sans-serif";tc.fillText(i+1,X(s[0])+8,X(s[1])-6);});
if(a){tc.strokeStyle="#4af";tc.beginPath();tc.arc(X(a.mx),X(a.my),a.sp/100*k,0,7);tc.stroke();tc.fillStyle="#4af";tc.fillRect(X(a.mx)-4,X(a.my)-4,8,8);}}
function cause(dx,dy){const L=dx<-4,R=dx>4,Lo=dy>4,Hi=dy<-4;
if(Lo&&L)return "sol-aşağı: tetiği sert çekme veya eli aşağı bastırma";
if(Lo&&R)return "sağ-aşağı: geri tepmeyi bekleyip irkilme veya parmağın tetikte az içeride olması";
if(Lo)return "aşağı: geri tepmeyi bekleyip bileği bastırma";
if(Hi)return "yukarı: atıştan önce bileği kaldırma veya nişanı yüksek tutma";
if(L)return "sola: parmağın tetikte fazla içeride olması";
if(R)return "sağa: parmağın tetikte az içeride olması";
return "merkeze yakın";}
function analyze(){const n=shots.length;if(n<3){$("diag").textContent="En az 3 atış gerekli (şu an "+n+").";return null;}
const hl=$("hand").value=="L",mir=x=>hl?-x:x;
const mx=shots.reduce((a,s)=>a+s[0],0)/n,my=shots.reduce((a,s)=>a+s[1],0)/n;
const sp=shots.reduce((a,s)=>a+Math.hypot(s[0]-mx,s[1]-my),0)/n*100;
const dx=mir((mx-.5)*100),dy=(my-.5)*100;
const T=[],O={};let nout=0;
shots.forEach((s,i)=>{if(out(s)){nout++;const c=cause(mir((s[0]-.5)*100),(s[1]-.5)*100);(O[c]=O[c]||[]).push(i+1);}});
if(nout){T.push(`Hedef dışına çıkan atışlar (${nout}):`);for(const c in O)T.push(`- ${O[c].join(", ")} numaralı: ${c}`);}
else T.push("Tüm atışlar hedefin içinde.");
if(sp>12)T.push("Grup geniş: nişan veya tetik tutarsız. Yavaş ve düz tetik çek.");
if(Math.hypot(dx,dy)>6)T.push("Genel eğilim → "+cause(dx,dy));else T.push("Grup merkeze yakın.");
const a={mx,my,sp,dx:dx.toFixed(1),dy:dy.toFixed(1),txt:T.join("\n")};
$("diag").textContent=`Atış: ${n} (dışarıda ${nout}) | Sapma: x ${a.dx}%, y ${a.dy}% | Grup: ${sp.toFixed(1)}%\n`+a.txt;draw(a);return a;}
$("b3").onclick=()=>{last_an=analyze();};
$("b4").onclick=()=>{shots=[];imgs=[];last_an=null;draw();$("diag").textContent="Sıfırlandı.";};
$("b5").onclick=async()=>{const a=last_an||analyze();if(!a)return;
let id=localStorage.getItem("dev");if(!id){id=crypto.randomUUID();localStorage.setItem("dev",id);}
const r=await fetch(SB_URL+"/rest/v1/sessions",{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json",Prefer:"return=minimal"},
body:JSON.stringify({device_id:id,shots,shot_count:shots.length,offset_x:+a.dx,offset_y:+a.dy,group_size:a.sp,diagnosis:a.txt})});
$("diag").textContent+=r.ok?"\n\nOturum kaydedildi.":"\n\nKayıt hatası: "+r.status;};
draw();
</script></body></html>
