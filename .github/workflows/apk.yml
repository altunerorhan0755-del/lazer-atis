name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/lazer/atis app/src/main/res/mipmap-xxxhdpi
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'HisarMNA'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.lazer.atis'
            compileSdk 34
            defaultConfig { applicationId 'com.lazer.atis'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
            signingConfigs { debug { storeFile file('../ks.jks'); storePassword 'hisarmna'; keyAlias 'hisar'; keyPassword 'hisarmna' } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.CAMERA"/>
            <uses-feature android:name="android.hardware.camera" android:required="false"/>
            <application android:label="HİSAR MNA" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/lazer/atis/MainActivity.java <<'EOF'
          package com.lazer.atis;
          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.*;
          import android.widget.EditText;
          public class MainActivity extends Activity {
            WebView w; PermissionRequest pend; ValueCallback<Uri[]> fc;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              w = new WebView(this); setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setMediaPlaybackRequiresUserGesture(false);
              w.setWebViewClient(new WebViewClient() {
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  String h = r.getUrl().getHost();
                  if (h != null && h.endsWith("onrender.com")) return false;
                  try { startActivity(new Intent(Intent.ACTION_VIEW, r.getUrl())); } catch (Exception e) {}
                  return true;
                }
              });
              w.setWebChromeClient(new WebChromeClient() {
                @Override public void onPermissionRequest(final PermissionRequest r) {
                  runOnUiThread(() -> {
                    if (checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) r.grant(r.getResources());
                    else { pend = r; requestPermissions(new String[]{Manifest.permission.CAMERA}, 1); }
                  });
                }
                @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  if (fc != null) fc.onReceiveValue(null);
                  fc = cb;
                  try { startActivityForResult(p.createIntent(), 2); } catch (Exception e) { fc = null; return false; }
                  return true;
                }
                @Override public boolean onJsPrompt(WebView v, String url, String msg, String def, final JsPromptResult r) {
                  final EditText et = new EditText(MainActivity.this); et.setText(def);
                  new AlertDialog.Builder(MainActivity.this).setMessage(msg).setView(et)
                    .setPositiveButton("Tamam", (d, i) -> r.confirm(et.getText().toString()))
                    .setNegativeButton("Iptal", (d, i) -> r.cancel())
                    .setOnCancelListener(d -> r.cancel()).show();
                  return true;
                }
                @Override public boolean onJsConfirm(WebView v, String url, String msg, final JsResult r) {
                  new AlertDialog.Builder(MainActivity.this).setMessage(msg)
                    .setPositiveButton("Tamam", (d, i) -> r.confirm())
                    .setNegativeButton("Iptal", (d, i) -> r.cancel())
                    .setOnCancelListener(d -> r.cancel()).show();
                  return true;
                }
                @Override public boolean onJsAlert(WebView v, String url, String msg, final JsResult r) {
                  new AlertDialog.Builder(MainActivity.this).setMessage(msg)
                    .setPositiveButton("Tamam", (d, i) -> r.confirm())
                    .setOnCancelListener(d -> r.cancel()).show();
                  return true;
                }
              });
              w.loadUrl("https://lazer-atis.onrender.com/");
            }
            @Override public void onRequestPermissionsResult(int c, String[] p, int[] g) {
              if (pend != null) { if (g.length > 0 && g[0] == PackageManager.PERMISSION_GRANTED) pend.grant(pend.getResources()); else pend.deny(); pend = null; }
            }
            @Override protected void onActivityResult(int rq, int rs, Intent d) {
              if (rq == 2 && fc != null) { fc.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(rs, d)); fc = null; }
            }
            @Override public void onBackPressed() { if (w.canGoBack()) w.goBack(); else super.onBackPressed(); }
          }
          EOF
          curl -sSfL https://lazer-atis.onrender.com/icon-512.png -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          python3 -m pip install -q pillow || true
          python3 - <<'PY' || echo "foto simge olusturulamadi"
          import json,re,base64,io,urllib.request
          from PIL import Image
          k="sb_publishable_y9NvJXOGbl2J_Ln-8WLLVw_MK84wAaR"
          q=urllib.request.Request("https://piwyqbqknzykwoujmoey.supabase.co/rest/v1/app_code?name=eq.main&select=code",headers={"apikey":k,"Authorization":"Bearer "+k,"Accept":"application/vnd.pgrst.object+json"})
          code=json.load(urllib.request.urlopen(q))["code"]
          m=max(re.findall(r"data:image/jpeg;base64,([A-Za-z0-9+/=]+)",code),key=len)
          im=Image.open(io.BytesIO(base64.b64decode(m))).convert("RGB")
          w,h=im.size
          s=min(w,h)
          im=im.crop(((w-s)//2,(h-s)//2,(w-s)//2+s,(h-s)//2+s)).resize((512,512),Image.LANCZOS)
          im.save("app/src/main/res/mipmap-xxxhdpi/ic_launcher.png")
          print("foto simge hazir")
          PY
      - name: Sign setup
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > ks.jks
          sed -i "s/versionCode 1;/versionCode ${{ github.run_number }};/" app/build.gradle
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HisarMNA.apk
          gh release delete apk-latest -y --cleanup-tag --repo ${{ github.repository }} || true
          gh release create apk-latest HisarMNA.apk --repo ${{ github.repository }} --title 'HİSAR MNA APK' --notes 'Telefona indirip kurun.'
